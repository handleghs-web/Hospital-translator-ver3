<main class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-3 p-3 lg:p-4 w-full overflow-hidden pb-4" style="min-height:calc(100vh - 65px)">
  <section class="bg-white rounded-2xl shadow-md p-4 flex flex-col border-2 border-blue-500 min-h-[42vh] overflow-hidden">

    <div class="flex justify-between items-center mb-3 border-b pb-2 flex-shrink-0 gap-2">

      <p class="text-[11px] text-slate-500 mt-1">현재 브라우저의 로컬 저장소에 저장됩니다. 공개 저장소 코드에 키를 직접 넣지 마세요.</p>
    </div>
    <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-900">
      실제 환자 진료정보를 사용하기 전 병원 보안·개인정보 담당자와 외부 AI 전송 및 보관 조건을 확인하세요.
    </div>
    <div class="flex justify-end gap-2 pt-3 border-t">
      <button onclick="toggleSettingsModal()" class="px-4 py-2 bg-slate-200 rounded-lg text-sm font-bold text-slate-700">취소</button>
      <button onclick="saveSettings()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-bold">저장하기</button>

<div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-[60] hidden bg-slate-900 text-white text-sm px-4 py-3 rounded-xl shadow-xl max-w-[90vw]"></div>

<script type="module">
import { GoogleGenAI, Modality } from "https://esm.sh/@google/genai";

let ai = null;
let liveSession = null;
let activeMode = null;
let mediaStream = null;
let audioContext = null;
let sourceNode = null;
let processorNode = null;
let outputContext = null;
let nextPlayTime = 0;
let isConnecting = false;
let sessionGeneration = 0;
let lastInputTextAt = 0;
let lastOutputTextAt = 0;
let patientLanguageHint = "";
let currentTurnMode = null;
let patientLanguageReady = false;
const LANGUAGE_NAMES = {"en-US":"English","vi-VN":"Vietnamese","zh-CN":"Chinese","ru-RU":"Russian","th-TH":"Thai","ja-JP":"Japanese","mn-MN":"Mongolian","km-KH":"Khmer","ne-NP":"Nepali","uz-UZ":"Uzbek"};
const LANGUAGE_KOREAN = {"en-US":"영어","vi-VN":"베트남어","zh-CN":"중국어","ru-RU":"러시아어","th-TH":"태국어","ja-JP":"일본어","mn-MN":"몽골어","km-KH":"캄보디아어","ne-NP":"네팔어","uz-UZ":"우즈베크어"};
let audioQueueSources = [];

const $ = id => document.getElementById(id);

function showToast(message, ms=4500) {
  const el = $("toast");
  el.textContent = message;
  el.classList.remove("hidden");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => el.classList.add("hidden"), ms);
}
function setStatus(text, color="text-slate-500") {
  $("modeStatusLabel").textContent = text;
  $("modeStatusLabel").className = `text-[11px] lg:text-xs font-bold ${color}`;
}
function appendMessage(boxId, label, text, kind="source") {
  if (!text || !text.trim()) return;
  const box = $(boxId);
  const empty = box.querySelector("p");
  if (empty) box.innerHTML = "";
  const card = document.createElement("div");
  card.className = kind === "translation"
    ? "p-3 rounded-xl bg-emerald-50 border border-emerald-200 my-2 shadow-sm"
    : "p-3 rounded-xl bg-white shadow-sm border border-slate-200 my-2";
  const title = document.createElement("span");
  title.className = kind === "translation"
    ? "text-xs text-emerald-700 font-bold block mb-1"
    : "text-xs text-slate-400 font-bold block mb-1";
  title.textContent = label;
  const body = document.createElement("div");
  body.className = kind === "translation" ? "font-bold text-slate-900" : "font-medium text-slate-800";
  body.textContent = text;
  card.append(title, body);
  box.appendChild(card);
  box.scrollTop = box.scrollHeight;
}
function clearPlaceholder(boxId, text) {
  $(boxId).innerHTML = "";
  const p = document.createElement("p");
  p.className = "text-slate-400 text-sm italic";
  p.textContent = text;
  $(boxId).appendChild(p);
}

function base64ToBytes(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}
function bytesToBase64(bytes) {
  let binary = "";
  const chunk = 0x8000;
  for (let i=0;i<bytes.length;i+=chunk) {
    binary += String.fromCharCode(...bytes.subarray(i, i+chunk));
  }
  return btoa(binary);
}
function floatTo16BitPCM(float32) {
  const out = new Int16Array(float32.length);
  for (let i=0;i<float32.length;i++) {
    const s = Math.max(-1, Math.min(1, float32[i]));
    out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  return new Uint8Array(out.buffer);
}
function resampleTo16k(float32, inputRate) {
  if (inputRate === 16000) return float32;
  const ratio = inputRate / 16000;
  const newLength = Math.floor(float32.length / ratio);
  const result = new Float32Array(newLength);
  for (let i=0;i<newLength;i++) {
    const start = Math.floor(i * ratio);
    const end = Math.min(Math.floor((i+1)*ratio), float32.length);
    let sum=0, count=0;
    for (let j=start;j<end;j++) { sum += float32[j]; count++; }
    result[i] = count ? sum/count : 0;
  }
  return result;
}

function stopPlayback() {
  for (const node of audioQueueSources) {
    try { node.stop(); } catch {}
  }
  audioQueueSources = [];
  if (outputContext) nextPlayTime = outputContext.currentTime;
}
function playPcm24k(base64) {
  if (!outputContext) outputContext = new AudioContext({sampleRate:24000});
  const bytes = base64ToBytes(base64);
  const pcm = new Int16Array(bytes.buffer, bytes.byteOffset, Math.floor(bytes.byteLength/2));
  const samples = new Float32Array(pcm.length);
  for (let i=0;i<pcm.length;i++) samples[i] = pcm[i] / 32768;
  const buffer = outputContext.createBuffer(1, samples.length, 24000);
  buffer.copyToChannel(samples, 0);
  const node = outputContext.createBufferSource();
  node.buffer = buffer;
  node.connect(outputContext.destination);
  const startAt = Math.max(outputContext.currentTime + 0.03, nextPlayTime);
  node.start(startAt);
  nextPlayTime = startAt + buffer.duration;
  audioQueueSources.push(node);
  node.onended = () => { audioQueueSources = audioQueueSources.filter(x => x !== node); };
}

function handleLiveMessage(message, myGeneration) {
  if (myGeneration !== sessionGeneration) return;
  const content = message.serverContent;
  if (!content) return;

  if (content.interrupted) stopPlayback();

  if (content.inputTranscription?.text) {
    const text = content.inputTranscription.text.trim();
    if (text) {
      const now = Date.now();
      if (now - lastInputTextAt > 350 || text.length > 4) {
        const speakerMode = currentTurnMode || activeMode;
        const box = speakerMode === "doctor" ? "doctorBox" : "patientBox";
        appendMessage(box, speakerMode === "doctor" ? "의료진 원문 (한국어)" : "환자 원문", text, "source");
        lastInputTextAt = now;
        if (speakerMode === "patient") {
          patientLanguageReady = true;
          if ($("autoDetectCheckbox").checked && !patientLanguageHint) patientLanguageHint = "auto";
          if ($("autoDetectCheckbox").checked) $("detectedLanguage").textContent = "자동 감지 사용 중";
        }
      }
    }
  }

  if (content.outputTranscription?.text) {
    const text = content.outputTranscription.text.trim();
    if (text) {
      const now = Date.now();
      if (now - lastOutputTextAt > 350 || text.length > 4) {
        const speakerMode = currentTurnMode || activeMode;
        const box = speakerMode === "doctor" ? "patientBox" : "doctorBox";
        appendMessage(box, speakerMode === "doctor" ? "환자 언어 번역" : "의료진 전달용 한국어", text, "translation");
        lastOutputTextAt = now;
      }
    }
  }

  const parts = content.modelTurn?.parts || [];
  for (const part of parts) {
    if (part.inlineData?.data && (part.inlineData.mimeType || "").startsWith("audio/")) {
      playPcm24k(part.inlineData.data);
    }
  }
}

async function getGeminiCredential() {
  const key = localStorage.getItem("geminiApiKey");
  if (!key) throw new Error("설정에서 Gemini API Key를 입력하세요.");
  return key;
}

async function ensureLiveSession() {
  if (liveSession) return liveSession;
  if (!window.isSecureContext) throw new Error("마이크 사용을 위해 HTTPS 주소에서 접속해야 합니다.");

  isConnecting = true;
  setStatus("Gemini Live 연결 중...", "text-blue-600");
  const credential = await getGeminiCredential();
  ai = new GoogleGenAI({apiKey:credential});
  const myGeneration = ++sessionGeneration;

  liveSession = await ai.live.connect({
    model: "gemini-3.8-live",
    config: {
      responseModalities: [Modality.AUDIO],
      inputAudioTranscription: {},
      outputAudioTranscription: {},
      systemInstruction: `You are a professional, highly accurate medical interpreter for a hospital consultation.
Translate only what the speaker says. Never answer questions, add advice, explain, summarize, or invent content.
Patient language setting: ${$("autoDetectCheckbox").checked ? "AUTOMATIC DETECTION. Detect the patient's primary language from the patient's first utterance, remember it for the session, and use it for all doctor-to-patient translations." : `FIXED LANGUAGE: ${LANGUAGE_NAMES[$("patientLanguageSelect").value]} (${$("patientLanguageSelect").value}).`}
The doctor speaks primarily Korean. English medical terminology may be naturally embedded in Korean sentences. Do NOT mistake these English terms for a change of language: interpret the whole utterance as Korean and translate the full meaning into the patient's selected or automatically detected language.
Preserve standard medical terms, drug names, disease names, laboratory test names, abbreviations, measurements, numbers, dates, laterality, negation, uncertainty, and dosage exactly. When useful, retain the original English clinical term in parentheses after its accurate translation. Do not render brand names, standardized abbreviations, or units as misleading equivalents.
Patient speech must be translated faithfully into Korean. Doctor speech must be translated faithfully into the patient's language. Output only the translation, speak it aloud, and provide matching text transcription. If unclear, do not guess; mark the unclear portion as [unclear].`
    },
    callbacks: {
      onmessage: message => handleLiveMessage(message, myGeneration),
      onerror: error => {
        console.error("Gemini Live error", error);
        setStatus("Gemini 연결 오류", "text-red-600");
        showToast(error?.message || "Gemini Live 연결 오류");
      },
      onclose: event => {
        if (myGeneration === sessionGeneration) {
          liveSession = null;
          setStatus("연결 종료", "text-slate-500");
          console.log("Live session closed", event);
        }
      }
    }
  });
  isConnecting = false;
  setStatus("Gemini Live 연결됨 · 자동 언어 감지", "text-emerald-600");
  return liveSession;
}

async function startMicrophone(mode) {
  const session = await ensureLiveSession();
  activeMode = mode;
  currentTurnMode = mode;
  stopPlayback();
  const autoDetect = $("autoDetectCheckbox").checked;
  const selectedCode = $("patientLanguageSelect").value;
  const selectedLanguage = LANGUAGE_NAMES[selectedCode] || "English";
  $("patientLanguageSelect").disabled = autoDetect || true;
  $("autoDetectCheckbox").disabled = true;
  if (mode === "patient") {
    patientLanguageHint = autoDetect ? "" : selectedCode;
    patientLanguageReady = false;
    $("detectedLanguage").textContent = autoDetect ? "자동 감지 대기" : (LANGUAGE_KOREAN[selectedCode] || "영어");
  }

  if (audioContext && audioContext.state !== "closed") {
    try { await audioContext.close(); } catch {}
  }
  audioContext = new AudioContext();
  await audioContext.resume();
  mediaStream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount:1, echoCancellation:true, noiseSuppression:true, autoGainControl:true }
  });

  sourceNode = audioContext.createMediaStreamSource(mediaStream);
  processorNode = audioContext.createScriptProcessor(4096, 1, 1);
  processorNode.onaudioprocess = event => {
    if (!liveSession || !activeMode) return;
    const input = event.inputBuffer.getChannelData(0);
    const resampled = resampleTo16k(input, audioContext.sampleRate);
    const pcmBytes = floatTo16BitPCM(resampled);
    const base64 = bytesToBase64(pcmBytes);
    try {
      liveSession.sendRealtimeInput({audio:{data:base64,mimeType:"audio/pcm;rate=16000"}});
    } catch (err) {
      console.error("Audio send failed", err);
    }
  };
  sourceNode.connect(processorNode);
  processorNode.connect(audioContext.destination);

  if (mode === "patient") {
    setStatus(autoDetect ? "환자 음성 수신 중 · 언어 자동 감지" : `환자 음성 수신 중 · ${LANGUAGE_KOREAN[selectedCode]} 지정`, "text-emerald-600");
    $("textPatient").textContent = "말하기 종료";
    $("btnPatientSpeak").classList.replace("bg-emerald-600","bg-red-600");
    $("btnDoctorSpeak").disabled = true;
  } else {
    if (!patientLanguageReady) {
      showToast("먼저 환자 말하기를 실행해 환자의 첫 발화를 받아 주세요.");
      await stopMicrophone();
      return;
    }
    setStatus("의료진 음성 수신 중 · 환자 언어로 번역", "text-blue-600");
    $("textDoctor").textContent = "말하기 종료";
    $("btnDoctorSpeak").classList.replace("bg-blue-600","bg-red-600");
    $("btnPatientSpeak").disabled = true;
  }
}

async function stopMicrophone() {
  activeMode = null;
  if (processorNode) {
    processorNode.onaudioprocess = null;
    try { processorNode.disconnect(); } catch {}
    processorNode = null;
  }
  if (sourceNode) {
    try { sourceNode.disconnect(); } catch {}
    sourceNode = null;
  }
  if (mediaStream) {
    mediaStream.getTracks().forEach(track => track.stop());
    mediaStream = null;
  }
  if (audioContext && audioContext.state !== "closed") {
    try { await audioContext.close(); } catch {}
  }
  audioContext = null;

  $("textDoctor").textContent = "의사 말하기";
  $("btnDoctorSpeak").classList.remove("bg-red-600");
  $("btnDoctorSpeak").classList.add("bg-blue-600");
  $("textPatient").textContent = "환자 말하기";
  $("btnPatientSpeak").classList.remove("bg-red-600");
  $("btnPatientSpeak").classList.add("bg-emerald-600");
  $("btnDoctorSpeak").disabled = false;
  $("btnPatientSpeak").disabled = false;
  $("autoDetectCheckbox").disabled = false;
  $("patientLanguageSelect").disabled = $("autoDetectCheckbox").checked;

  if (liveSession) {
    try { liveSession.sendRealtimeInput({audioStreamEnd:true}); } catch {}
  }
  setStatus(liveSession ? "Gemini Live 연결됨 · 대기 중" : "Gemini Live 연결 대기", liveSession ? "text-emerald-600" : "text-slate-500");
}

window.toggleSpeech = async function(mode) {
  if (isConnecting) return;
  if (activeMode === mode) {
    await stopMicrophone();
    return;
  }
  if (activeMode) await stopMicrophone();
  try {
    await startMicrophone(mode);
  } catch (err) {
    console.error(err);
    await stopMicrophone();
    showToast(err.message || "마이크 또는 Gemini 연결에 실패했습니다.", 6500);
    setStatus("연결 실패", "text-red-600");
  }
};

window.clearChatOnly = async function() {
  await stopMicrophone();
  stopPlayback();
  clearPlaceholder("doctorBox", "의사 말하기를 누르고 한국어로 말씀하세요.");
  clearPlaceholder("patientBox", "버튼을 누르고 환자의 모국어로 말씀하세요.");
  $("detectedLanguage").textContent = "아직 감지 전";
  patientLanguageHint = "";
  patientLanguageReady = false;
  currentTurnMode = null;
  $("detectedLanguage").textContent = $("autoDetectCheckbox").checked ? "자동 감지 대기" : (LANGUAGE_KOREAN[$("patientLanguageSelect").value] || "영어");
  if (liveSession) {
    try { liveSession.close(); } catch {}
    liveSession = null;
  }
  ai = null;
  setStatus("대화 초기화 · 새 연결 대기", "text-slate-500");
};

window.toggleFlipPatientScreen = function() {
  $("patientSection").classList.toggle("rotate-180-custom");
};
window.toggleSettingsModal = function() {
  $("settingsModal").classList.toggle("hidden");
};
window.saveSettings = function() {
  const name = $("inputHospitalName").value.trim();
  if (name) {
    localStorage.setItem("hospitalName", name);
    $("hospitalNameDisplay").textContent = name;
  }
  const apiKey = $("inputGeminiKey").value.trim();
  if (apiKey) localStorage.setItem("geminiApiKey", apiKey);
  const logoFile = $("inputHospitalLogo").files[0];
  if (logoFile) {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        localStorage.setItem("hospitalLogo", e.target.result);
        applyLogo(e.target.result);
      } catch {
        showToast("로고 파일이 너무 큽니다. 작은 이미지로 다시 등록해 주세요.");
      }
    };
    reader.readAsDataURL(logoFile);
  }
  toggleSettingsModal();
  showToast("설정을 저장했습니다.");
};
function applyLogo(src) {
  $("hospitalLogo").src = src;
  $("hospitalLogo").classList.remove("hidden");
  $("logoPlaceholder").classList.add("hidden");
}

function loadSettings() {
  const name = localStorage.getItem("hospitalName");
  const logo = localStorage.getItem("hospitalLogo");
  const apiKey = localStorage.getItem("geminiApiKey");
  if (name) {
    $("hospitalNameDisplay").textContent = name;
    $("inputHospitalName").value = name;
  }
  if (logo) applyLogo(logo);
  if (apiKey) $("inputGeminiKey").value = apiKey;
  const savedLanguage = localStorage.getItem("patientLanguage");
  const savedAutoDetect = localStorage.getItem("autoDetectLanguage");
  if (savedLanguage && LANGUAGE_NAMES[savedLanguage]) $("patientLanguageSelect").value = savedLanguage;
  if (savedAutoDetect === "true") $("autoDetectCheckbox").checked = true;
  $("patientLanguageSelect").disabled = $("autoDetectCheckbox").checked;
  $("detectedLanguage").textContent = $("autoDetectCheckbox").checked ? "자동 감지 대기" : (LANGUAGE_KOREAN[$("patientLanguageSelect").value] || "영어");
}
loadSettings();
function resetIdleSessionForLanguageChange() {
  if (activeMode) return;
  if (liveSession) { try { liveSession.close(); } catch {} liveSession = null; }
  ai = null;
}
$("patientLanguageSelect").addEventListener("change", () => {
  localStorage.setItem("patientLanguage", $("patientLanguageSelect").value);
  if (!$("autoDetectCheckbox").checked) $("detectedLanguage").textContent = LANGUAGE_KOREAN[$("patientLanguageSelect").value] || "영어";
  resetIdleSessionForLanguageChange();
});
$("autoDetectCheckbox").addEventListener("change", () => {
  $("patientLanguageSelect").disabled = $("autoDetectCheckbox").checked;
  localStorage.setItem("autoDetectLanguage", String($("autoDetectCheckbox").checked));
  $("detectedLanguage").textContent = $("autoDetectCheckbox").checked ? "자동 감지 대기" : (LANGUAGE_KOREAN[$("patientLanguageSelect").value] || "영어");
  resetIdleSessionForLanguageChange();
});

window.addEventListener("beforeunload", () => {
  try { liveSession?.close(); } catch {}
  mediaStream?.getTracks().forEach(t=>t.stop());
});
</script>
</body>
</html>
